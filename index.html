<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNIC Fingerprint Founder System - Final Stable</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 650px; background: white; margin: 30px auto; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a365d; margin-bottom: 5px; }
        .system-owner { font-size: 14px; color: #718096; margin-bottom: 20px; }
        .warning-box { background-color: #fffaf0; border: 1px solid #feebc8; color: #c05621; padding: 15px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; font-weight: bold; }
        
        /* Textarea hamesha ready state me rahega */
        textarea { width: 100%; height: 150px; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 16px; font-family: inherit; resize: vertical; background-color: #ffffff !important; color: #000000 !important; }
        
        button { width: 100%; background-color: #319795; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-bottom: 15px; }
        button:hover { background-color: #2c7a7b; }
        
        .engine-status { font-weight: bold; font-size: 14px; margin-bottom: 15px; color: #dd6b20; }
        .results-container { display: none; margin-top: 20px; text-align: left; }
        .results-container h3 { color: #1a365d; margin-bottom: 10px; border-bottom: 2px solid #edf2f7; padding-bottom: 5px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border: 1px solid #e2e8f0; text-align: left; font-size: 13px; }
        th { background-color: #2b6cb0; color: white; font-weight: bold; }
        tr:nth-child(even) { background-color: #f7fafc; }
        
        .status-badge { padding: 3px 6px; border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-block; }
        .badge-found { background-color: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .badge-not-found { background-color: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; }
    </style>
</head>
<body>

<div class="container">
    <h2>CNIC FINGERPRINT FOUNDER SYSTEM</h2>
    <div class="system-owner">SYSTEM OWNER: Rana Vyke Urf Bablo</div>
    
    <div class="warning-box">
        ⚠️ SYSTEM FEES WARNING<br>
        Ek CNIC Fingerprint Found Hony Par 1200 Rs Cut Hoga! Balance Lazmi Check Kar Lain.
    </div>

    <div id="engineStatus" class="engine-status">🔄 Connecting to database stream... Please wait...</div>

    <textarea id="cnicBulkInput" placeholder="Enter target CNICs (Line-by-Line):&#10;5440178619178&#10;5530232277050"></textarea>
    <button id="searchBtn" onclick="searchBulkFast()">START FAST BULK SEARCH</button>
    
    <div id="resultsContainer" class="results-container">
        <h3>Search Results:</h3>
        <table>
            <thead>
                <tr>
                    <th>Sr No.</th>
                    <th>CNIC Number</th>
                    <th>Status</th>
                    <th>Database Location</th>
                </tr>
            </thead>
            <tbody id="resultsTableBody"></tbody>
        </table>
    </div>
</div>

<script>
// Memory tables
let localCnicArray = [];
let localOwnerArray = [];
let isDatabaseReady = false;

// ⚠️ APNA NEW DEPLOYMENT URL YAHAN PASTE KAREIN
const scriptUrl = "https://script.google.com/macros/s/AKfycbxya9Jvq4E9tKQKZ7sdjZAvf30DC4huTIWcSvUbwlF6lXKW3GhTktZSKd6j3j-JN87ZjQ/exec"; 

// Background auto data fetcher
async function downloadDatabaseToBrowser() {
    let statusBox = document.getElementById('engineStatus');
    try {
        let response = await fetch(scriptUrl);
        let data = await response.json();
        
        if (data.cnics && data.owners) {
            localCnicArray = data.cnics;
            localOwnerArray = data.owners;
            isDatabaseReady = true;
            statusBox.textContent = `✅ Turbo Engine Online! ${localCnicArray.length.toLocaleString()} records cached successfully.`;
            statusBox.style.color = "#38a169";
            return true;
        } else {
            statusBox.textContent = "⚠️ Sheet data empty or layout conflict.";
            statusBox.style.color = "#e53e3e";
            return false;
        }
    } catch (error) {
        statusBox.textContent = "⚠️ Cloud Network Syncing Error. Will auto-retry on click.";
        statusBox.style.color = "#dd6b20";
        console.error(error);
        return false;
    }
}

async function searchBulkFast() {
    let rawInput = document.getElementById('cnicBulkInput').value;
    let resultsContainer = document.getElementById('resultsContainer');
    let tableBody = document.getElementById('resultsTableBody');
    let statusBox = document.getElementById('engineStatus');
    
    let cnicList = rawInput.split('\n')
                          .map(line => line.replace(/[^0-9]/g, '').trim())
                          .filter(line => line.length >= 5);
                          
    if(cnicList.length === 0) {
        alert('Baraye meharbani kam az kam aik darust CNIC darj karein.');
        return;
    }

    // Fail-Safe: Agar automatic data sync nahi hua tha, toh search click karne par yeh foran live fetch karega
    if (!isDatabaseReady) {
        statusBox.textContent = "🔄 Fetching cloud database stream... Please hold...";
        statusBox.style.color = "#dd6b20";
        let retrySuccess = await downloadDatabaseToBrowser();
        if(!retrySuccess) {
            alert("Database download nahi ho saka. Ya toh internet bnd hai ya Google Script ka URL sahi nahi lagaya.");
            return;
        }
    }
    
    tableBody.innerHTML = "";
    
    // Fast local browser RAM engine indexing loop
    for (let i = 0; i < cnicList.length; i++) {
        let currentCnic = cnicList[i];
        
        let row = document.createElement('tr');
        let cellSr = document.createElement('td');
        cellSr.textContent = i + 1;
        
        let cellCnic = document.createElement('td');
        cellCnic.textContent = currentCnic;
        
        let cellStatus = document.createElement('td');
        let cellOwner = document.createElement('td');
        
        // Match optimization index pattern
        let matchIndex = localCnicArray.indexOf(currentCnic);
        
        if (matchIndex !== -1) {
            cellStatus.innerHTML = `<span class="status-badge badge-found">✅ FOUND</span>`;
            cellOwner.textContent = localOwnerArray[matchIndex]; 
        } else {
            cellStatus.innerHTML = `<span class="status-badge badge-not-found">❌ NOT FOUND</span>`;
            cellOwner.textContent = "-";
        }
        
        row.appendChild(cellSr);
        row.appendChild(cellCnic);
        row.appendChild(cellStatus);
        row.appendChild(cellOwner);
        tableBody.appendChild(row);
    }
    
    resultsContainer.style.display = 'block';
}

// Windows page trigger stream
window.onload = downloadDatabaseToBrowser;
</script>
</body>
</html>
