<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNIC Fingerprint Founder System - Vyke Pro</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; text-align: center; color: #333; }
        .container { max-width: 600px; background: white; margin: 20px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
        h2 { color: #1a365d; margin-bottom: 5px; font-size: 24px; text-transform: uppercase; }
        .system-owner { font-size: 13px; color: #4a5568; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .warning-box { background-color: #fffaf0; border: 1px solid #feebc8; color: #c05621; padding: 15px; border-radius: 8px; font-size: 13px; margin-bottom: 25px; font-weight: bold; line-height: 1.5; }
        
        textarea { width: 100%; height: 160px; padding: 14px; margin: 10px 0; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; font-size: 16px; font-family: monospace; resize: vertical; }
        textarea:focus { border-color: #319795; outline: none; box-shadow: 0 0 0 3px rgba(49, 151, 149, 0.15); }
        
        button { width: 100%; background-color: #319795; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        button:hover { background-color: #2c7a7b; }
        button:disabled { background-color: #cbd5e0; cursor: not-allowed; }
        
        .loader-status { font-weight: bold; font-size: 14px; margin: 15px 0; color: #dd6b20; display: none; }
        .results-container { display: none; margin-top: 25px; text-align: left; }
        
        .results-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #edf2f7; padding-bottom: 6px; margin-bottom: 12px; }
        .results-header h3 { color: #1a365d; margin: 0; font-size: 16px; }
        
        /* Copy All Button Style */
        .copy-all-btn { background-color: #2b6cb0; color: white; border: none; padding: 8px 14px; font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; text-transform: uppercase; width: auto; margin: 0; }
        .copy-all-btn:hover { background-color: #2b6cb0; opacity: 0.9; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #e2e8f0; text-align: left; font-size: 13px; }
        th { background-color: #2b6cb0; color: white; font-weight: bold; }
        tr:nth-child(even) { background-color: #f7fafc; }
        
        .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-block; }
        .badge-found { background-color: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .badge-not-found { background-color: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; }
    </style>
</head>
<body>

<div class="container">
    <h2>CNIC FINGERPRINT FOUNDER SYSTEM</h2>
    <div class="system-owner">SYSTEM OWNER: Rana Vyke Urf Bablo</div>
    
    <div class="warning-box">
        ⚠️ SYSTEM FEES WARNING<br>
        Ek CNIC Fingerprint Found Hony Par 1800 Rs Cut Hoga! Balance Lazmi Check Kar Lain.
    </div>

    <div id="loaderStatus" class="loader-status">🔄 Connecting to secure cloud engine... Please wait...</div>

    <label style="font-weight: 600; font-size: 14px; color: #4a5568; display: block; text-align: left; margin-bottom: 5px;">Enter target CNICs (Line-by-Line):</label>
    <textarea id="cnicBulkInput" placeholder="5440178619178&#10;5530232277050"></textarea>
    
    <button id="searchBtn" onclick="startSecureBulkCloudSearch()">START SECURE BULK SEARCH</button>
    
    <div id="resultsContainer" class="results-container">
        <div class="results-header">
            <h3>⚡ SEARCH RESULTS</h3>
            <!-- Main Copy Button for All Found Results -->
            <button id="copyAllBtn" class="copy-all-btn" onclick="copyAllFoundCnics()">📋 Copy All Found</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th style="width: 15%;">Sr No.</th>
                    <th style="width: 45%;">CNIC Number</th>
                    <th style="width: 20%;">Status</th>
                    <th style="width: 20%;">Database Location</th>
                </tr>
            </thead>
            <tbody id="resultsTableBody"></tbody>
        </table>
    </div>
</div>

<script>
// ⚠️ APNA NEW DEPLOYMENT URL ISS NICHE WAALI LINE MEIN PASTE KAREIN
const scriptUrl = "https://script.google.com/macros/s/AKfycby9mlGchLRaSbzrO7A1-uP5u0bVW3HixjoDcCr4Z5YSFKJQu3bZutB_g0fhmg4Vw_o3CA/exec"; 

// Global array to store only found CNICs for easy bulk extraction
let currentFoundCnicsList = [];

async function startSecureBulkCloudSearch() {
    let rawInput = document.getElementById('cnicBulkInput').value;
    let resultsContainer = document.getElementById('resultsContainer');
    let tableBody = document.getElementById('resultsTableBody');
    let loader = document.getElementById('loaderStatus');
    let searchBtn = document.getElementById('searchBtn');
    
    // Reset global list
    currentFoundCnicsList = [];
    
    // Clean and split lines to process clean integers only
    let cnicList = rawInput.split('\n')
                           .map(line => line.replace(/[^0-9]/g, '').trim())
                           .filter(line => line.length >= 5);
                           
    if(cnicList.length === 0) {
        alert('Baraye meharbani kam az kam aik darust CNIC darj karein.');
        return;
    }
    
    // UI Loading State Reset
    loader.style.display = "block";
    searchBtn.disabled = true;
    resultsContainer.style.display = 'none';
    tableBody.innerHTML = "";
    
    try {
        // Safe query transport string format
        let finalRequestUrl = `${scriptUrl}?cnics=${encodeURIComponent(cnicList.join(','))}`;
        
        let response = await fetch(finalRequestUrl);
        let json = await response.json();
        
        if (json.status === "success" && json.data) {
            let resultsData = json.data;
            
            for (let i = 0; i < resultsData.length; i++) {
                let item = resultsData[i];
                let row = document.createElement('tr');
                
                let cellSr = document.createElement('td');
                cellSr.textContent = i + 1;
                
                let cellCnic = document.createElement('td');
                cellCnic.textContent = item.cnic;
                
                let cellStatus = document.createElement('td');
                let cellOwner = document.createElement('td');
                
                if (item.status === "found") {
                    cellStatus.innerHTML = `<span class="status-badge badge-found">✅ FOUND</span>`;
                    cellOwner.textContent = item.owner; 
                    
                    // Push to our batch copy target array
                    currentFoundCnicsList.push(item.cnic);
                } else {
                    cellStatus.innerHTML = `<span class="status-badge badge-not-found">❌ NOT FOUND</span>`;
                    cellOwner.textContent = "-";
                }
                
                row.appendChild(cellSr);
                row.appendChild(cellCnic);
                row.appendChild(cellStatus);
                row.appendChild(cellOwner);
                tableBody.appendChild(row);
            }
            
            // Show or hide the copy button depending on if we found anything
            let copyAllBtn = document.getElementById('copyAllBtn');
            if (currentFoundCnicsList.length > 0) {
                copyAllBtn.style.display = "block";
                copyAllBtn.textContent = `📋 Copy All Found (${currentFoundCnicsList.length})`;
            } else {
                copyAllBtn.style.display = "none";
            }
            
            resultsContainer.style.display = 'block';
        } else {
            alert("Database Response Error: " + (json.message || "Unknown error layout."));
        }
    } catch (error) {
        alert("Network Error: Request block ho gayi hai. Sahi tarike se 'Anyone' permission ke sath New Deployment URL generate karke code me lagaein.");
        console.error(error);
    } finally {
        loader.style.display = "none";
        searchBtn.disabled = false;
    }
}

// Handler to trigger batch export to system clipboard
function copyAllFoundCnics() {
    if (currentFoundCnicsList.length === 0) {
        alert("Copy karne ke liye koi bhi FOUND result majood nahi hai.");
        return;
    }
    
    // Join all numbers with a newline so they remain clean line-by-line
    let bulkText = currentFoundCnicsList.join('\n');
    let copyAllBtn = document.getElementById('copyAllBtn');
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(bulkText).then(() => {
            showBulkCopiedFeedback(copyAllBtn);
        }).catch(err => {
            fallbackBulkCopy(bulkText, copyAllBtn);
        });
    } else {
        fallbackBulkCopy(bulkText, copyAllBtn);
    }
}

// Fallback clipboard logic for decoupled execution environments
function fallbackBulkCopy(text, buttonElement) {
    let textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed"; 
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
        document.execCommand('copy');
        showBulkCopiedFeedback(buttonElement);
    } catch (err) {
        alert('Afsos! Bulk data copy nahi ho saka.');
    }
    document.body.removeChild(textArea);
}

// Visual confirmation state
function showBulkCopiedFeedback(btn) {
    let originalText = btn.textContent;
    btn.textContent = '✔️ All Copied!';
    btn.style.backgroundColor = '#2f855a';
    setTimeout(() => {
        btn.textContent = `📋 Copy All Found (${currentFoundCnicsList.length})`;
        btn.style.backgroundColor = '#2b6cb0';
    }, 2000);
}
</script>
</body>
</html>
