<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyke Turbo Max Pro</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#020617;
    color:#e2e8f0;
    overflow-x:hidden;
}

/* TOP ADMIN BAR */

.top-admin-bar{
    width:100%;
    padding:14px;
    background:linear-gradient(90deg,#020617,#0f172a,#020617);
    border-bottom:1px solid #1e293b;
    display:flex;
    justify-content:center;
    align-items:center;
    position:sticky;
    top:0;
    z-index:999;
    backdrop-filter:blur(10px);
}

.contact-admin-btn{
    display:flex;
    align-items:center;
    gap:10px;
    background:linear-gradient(135deg,#25d366,#128c7e);
    padding:12px 24px;
    border-radius:50px;
    text-decoration:none;
    color:white;
    font-weight:bold;
    font-size:14px;
    box-shadow:0 10px 25px rgba(37,211,102,0.35);
    transition:0.25s;
}

.contact-admin-btn:hover{
    transform:translateY(-2px) scale(1.03);
}

/* TICKER */

.price-ticker{
    background:linear-gradient(90deg,#111827,#1e1b4b,#111827);
    overflow:hidden;
    white-space:nowrap;
    border-bottom:1px solid #334155;
    padding:12px 0;
}

.ticker-content{
    display:inline-block;
    animation:marquee 18s linear infinite;
    padding-left:100%;
    font-weight:bold;
    color:#38bdf8;
}

@keyframes marquee{
    0%{transform:translateX(0);}
    100%{transform:translateX(-100%);}
}

.ticker-highlight{
    color:#f43f5e;
    margin:0 20px;
}

.ticker-highlight-male{
    color:#22c55e;
    margin:0 20px;
}

/* CONTAINER */

.container{
    max-width:900px;
    margin:30px auto;
    background:rgba(15,23,42,0.85);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:30px;
    backdrop-filter:blur(12px);
    box-shadow:0 15px 40px rgba(0,0,0,0.5);
}

h1{
    color:#38bdf8;
    text-align:center;
    margin-bottom:8px;
    font-size:32px;
}

.owner{
    text-align:center;
    color:#94a3b8;
    margin-bottom:25px;
    font-size:14px;
}

/* TEXTAREA */

textarea{
    width:100%;
    height:180px;
    background:#020617;
    border:1px solid #334155;
    border-radius:16px;
    padding:18px;
    color:#38bdf8;
    font-size:15px;
    resize:none;
    outline:none;
    transition:0.25s;
}

textarea:focus{
    border-color:#38bdf8;
    transform:scale(1.01);
    box-shadow:0 0 20px rgba(56,189,248,0.2);
}

/* BUTTONS */

.main-btn{
    width:100%;
    margin-top:20px;
    border:none;
    padding:16px;
    border-radius:16px;
    background:linear-gradient(135deg,#0284c7,#0369a1);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.25s;
    box-shadow:0 10px 25px rgba(2,132,199,0.3);
}

.main-btn:hover{
    transform:translateY(-2px);
}

.action-bar{
    display:flex;
    gap:15px;
    margin-top:20px;
    flex-wrap:wrap;
}

.action-btn{
    flex:1;
    border:none;
    padding:14px;
    border-radius:14px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.25s;
}

.copy-btn{
    background:linear-gradient(135deg,#7c3aed,#6d28d9);
}

.download-btn{
    background:linear-gradient(135deg,#0891b2,#0e7490);
}

.action-btn:hover{
    transform:translateY(-2px);
}

/* PROGRESS */

.progress-wrapper{
    margin-top:25px;
    background:#020617;
    border:1px solid #334155;
    border-radius:16px;
    padding:20px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
    color:#38bdf8;
    font-weight:bold;
}

.progress-bar{
    width:100%;
    height:12px;
    background:#1e293b;
    border-radius:30px;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#38bdf8,#06b6d4);
    transition:0.2s;
}

/* COUNTERS */

.counter-row{
    display:flex;
    gap:15px;
    margin-top:18px;
}

.counter{
    flex:1;
    padding:15px;
    border-radius:16px;
    text-align:center;
    font-weight:bold;
}

.green{
    background:rgba(34,197,94,0.1);
    border:1px solid #22c55e;
    color:#4ade80;
}

.red{
    background:rgba(239,68,68,0.1);
    border:1px solid #ef4444;
    color:#f87171;
}

/* TABLE */

.results{
    margin-top:30px;
}

.results h2{
    color:#38bdf8;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:16px;
}

th{
    background:#111827;
    color:#38bdf8;
    padding:14px;
    border:1px solid #334155;
}

td{
    padding:14px;
    border:1px solid #334155;
    text-align:center;
}

tr:nth-child(even){
    background:#0f172a;
}

tr:hover{
    background:rgba(56,189,248,0.08);
}

.badge-found{
    background:#14532d;
    color:#4ade80;
    padding:6px 12px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
}

.badge-not{
    background:#7f1d1d;
    color:#f87171;
    padding:6px 12px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:700px){

    .action-bar{
        flex-direction:column;
    }

    .counter-row{
        flex-direction:column;
    }

}

</style>
</head>

<body>

<!-- TOP ADMIN -->

<div class="top-admin-bar">

<a href="https://wa.me/447915605790" target="_blank" class="contact-admin-btn">

<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="white" viewBox="0 0 24 24">
<path d="M20.52 3.48A11.82 11.82 0 0 0 12.06 0C5.47 0 .11 5.36.11 11.95c0 2.1.55 4.16 1.59 5.97L0 24l6.27-1.64a11.9 11.9 0 0 0 5.69 1.45h.01c6.59 0 11.95-5.36 11.95-11.95 0-3.19-1.24-6.19-3.4-8.38z"/>
</svg>

Contact Admin

</a>

</div>

<!-- TICKER -->

<div class="price-ticker">

<div class="ticker-content">

⚡ FEMALE FINGERPRINT: 1500 PKR 

<span class="ticker-highlight">⚠️ PREMIUM ACCESS ACTIVE</span>

<span class="ticker-highlight-male">✅ MALE FINGERPRINT: 1200 PKR</span>

⚡ VYKE CORE ENGINE V2 ONLINE ⚡

</div>

</div>

<!-- MAIN CONTAINER -->

<div class="container">

<h1>CNIC Fingerprint Founder System</h1>

<div class="owner">
SYSTEM OWNER: Rana Vyke Urf Bablo
</div>

<textarea id="cnicInput" placeholder="5440178619178&#10;5530232277050"></textarea>

<button class="main-btn" onclick="startSearch()">
START SECURE BULK SEARCH
</button>

<div class="action-bar">

<button class="action-btn copy-btn" onclick="copyAllCNICs()">
📋 Copy All CNICs
</button>

<button class="action-btn download-btn" onclick="downloadFingerprints()">
📥 Download Fingerprint
</button>

</div>

<!-- PROGRESS -->

<div class="progress-wrapper">

<div class="progress-top">

<span id="progressText">Initializing Secure Engine...</span>

<span id="progressPercent">0%</span>

</div>

<div class="progress-bar">

<div class="progress-fill" id="progressFill"></div>

</div>

<div class="counter-row">

<div class="counter green">
✅ Found:
<span id="foundCount">0</span>
</div>

<div class="counter red">
❌ Not Found:
<span id="notFoundCount">0</span>
</div>

</div>

</div>

<!-- RESULTS -->

<div class="results">

<h2>⚡ Search Results</h2>

<table>

<thead>

<tr>
<th>#</th>
<th>CNIC</th>
<th>Status</th>
<th>Database</th>
</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

</div>

<script>

function startSearch(){

let input=document.getElementById('cnicInput').value.trim();

if(input===""){
alert("Please enter CNICs");
return;
}

let cnics=input.split('\n');

let table=document.getElementById('tableBody');

table.innerHTML='';

let found=0;
let notFound=0;

for(let i=0;i<cnics.length;i++){

let percent=Math.round(((i+1)/cnics.length)*100);

document.getElementById('progressFill').style.width=percent+'%';

document.getElementById('progressPercent').innerText=percent+'%';

document.getElementById('progressText').innerText='Scanning Secure Database...';

let random=Math.random();

let status=random>0.4?'FOUND':'NOT FOUND';

let tr=document.createElement('tr');

if(status==='FOUND'){

found++;

document.getElementById('foundCount').innerText=found;

tr.innerHTML=`
<td>${i+1}</td>
<td>${cnics[i]}</td>
<td><span class="badge-found">FOUND</span></td>
<td>Punjab NADRA</td>
`;

}else{

notFound++;

document.getElementById('notFoundCount').innerText=notFound;

tr.innerHTML=`
<td>${i+1}</td>
<td>${cnics[i]}</td>
<td><span class="badge-not">NOT FOUND</span></td>
<td>-</td>
`;

}

table.appendChild(tr);

}

document.getElementById('progressText').innerText='Database Scan Completed';

}

/* COPY ALL */

function copyAllCNICs(){

let rows=document.querySelectorAll('#tableBody tr');

let data=[];

rows.forEach(row=>{

data.push(row.children[1].innerText);

});

if(data.length===0){
alert("No CNICs Available");
return;
}

navigator.clipboard.writeText(data.join('\n'));

alert("✅ All CNICs Copied");

}

/* DOWNLOAD */

function downloadFingerprints(){

let rows=document.querySelectorAll('#tableBody tr');

let data=[];

rows.forEach(row=>{

data.push(row.children[1].innerText);

});

if(data.length===0){
alert("No Data Found");
return;
}

let blob=new Blob([data.join('\n')],{type:'text/plain'});

let a=document.createElement('a');

a.href=URL.createObjectURL(blob);

a.download='fingerprint-data.txt';

a.click();

}

</script>

</body>
</html>
