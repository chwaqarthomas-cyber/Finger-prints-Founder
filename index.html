<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Agent X Paradox - AutoTrx.org</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #fce4ec 0%, #efebe9 50%, #e0f2f1 100%);
            color: #333; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
        }

        .container { 
            background: rgba(255, 255, 255, 0.9); 
            padding: 35px; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05); 
            width: 100%; 
            max-width: 850px; 
            z-index: 3;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .main-header-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 25px;
            border: 1px solid #e0e0e0;
        }

        h2 { 
            color: #00796b; 
            text-align: center; 
            margin-top: 0; 
            font-size: 20px; 
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .db-title {
            color: #e65100;
            text-align: center;
            font-weight: 700; 
            font-size: 24px;  
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .info-box {
            background: #f9f9f9;
            border-left: 5px solid #009688;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 15px; 
            line-height: 1.6;
            color: #555;
            box-shadow: 0 2px 5px rgba(0,0,0,0.01);
        }

        .info-box .highlight {
            color: #d84315;
            font-weight: 700;
        }

        p.prompt-text { 
            color: #444; 
            font-size: 16px; 
            margin: 0 0 10px 0; 
            font-weight: 600; 
        }
        
        textarea { 
            width: 100%; 
            height: 140px; 
            padding: 15px; 
            background-color: #ffffff;
            color: #333;
            border: 2px solid #ced4da; 
            border-radius: 12px; 
            resize: none; 
            font-size: 16px; 
            margin-bottom: 20px; 
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
            transition: border-color 0.2s;
        }
        
        textarea:focus { 
            border-color: #009688; 
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        button.scan-btn { 
            flex: 2;
            background: linear-gradient(90deg, #009688, #00bfa5);
            color: #fff; 
            border: none; 
            padding: 16px; 
            font-size: 16px; 
            font-weight: 700; 
            border-radius: 12px; 
            cursor: pointer; 
            box-shadow: 0 4px 12px rgba(0, 150, 136, 0.2);
            transition: all 0.2s ease;
        }

        button.scan-btn:hover { 
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(0, 150, 136, 0.3);
        }

        .copy-btn {
            flex: 1;
            background: #ffffff;
            color: #009688;
            border: 2px solid #009688;
            display: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
        }

        .status-msg { 
            text-align: center; 
            font-weight: 600; 
            margin-top: 15px; 
            color: #ef6c00; 
            font-size: 15px; 
        }

        .results-box { 
            margin-top: 30px; 
            border-top: 1px solid #e0e0e0; 
            padding-top: 20px; 
            display: none; 
        }

        /* Lock Card Setup */
        .lock-notice-card {
            background: #fff3e0;
            border: 1px solid #ffe0b2;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
        }
        .lock-title { color: #d84315; font-size: 18px; font-weight: 700; margin-bottom: 10px; }
        .lock-desc { color: #e65100; font-size: 15px; line-height: 1.5; margin-bottom: 15px; }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px; 
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        th, td { 
            padding: 14px; 
            text-align: center; 
            border-bottom: 1px solid #edf2f7; 
            vertical-align: middle;
        }

        th { 
            background-color: #f7fafc; 
            color: #4a5568;
            font-size: 14px; 
            font-weight: 700;
        }

        td { color: #2d3748; font-size: 15px; }

        .badge { 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 700; 
            text-transform: uppercase;
            display: inline-block;
        }

        .badge.found { 
            background-color: #e6fffa; 
            color: #319795; 
            border: 1px solid #b2f5ea;
        }

        .download-btn {
            background: linear-gradient(135deg, #ff9100, #ff3d00);
            color: #fff; border: none; padding: 10px 15px; font-size: 13px; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; width: 100%; justify-content: center; box-shadow: 0 2px 6px rgba(255,61,0,0.2);
        }

        .wa-box { display: flex; align-items: center; justify-content: center; margin-top: 10px; background: #e8f5e9; padding: 10px; border-radius: 8px; border: 1px solid #c8e6c9; }
        .wa-link { color: #2e7d32; font-size: 28px; cursor: pointer; text-decoration: none; display: inline-block; }
        .wa-text { color: #1b5e20; font-size: 12px; margin-left: 10px; font-weight: 600; text-align: left; max-width: 220px; line-height: 1.3; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-header-card">
        <h2>Smart Agent X Paradox – AutoTrx.org</h2>
    </div>
    <div class="db-title">CNIC FINGERPRINT FOUNDER SYSTEM</div>
    
    <div class="info-box">
        <strong>⚙️ SYSTEM NOTICE:</strong> Jin k pas Jazzcash Few Step Waly CNIC k fingerprint Nahi hain, wo yhaan hamre database se found krain. Record found hony par WhatsApp icon par click kr k direct inbox ayein.
    </div>

    <p class="prompt-text">Enter target CNICs (Line-by-Line):</p>
    <textarea id="searchInput" placeholder="3520212345677&#10;3120105711484"></textarea>
    
    <div class="btn-group">
        <button class="scan-btn" onclick="searchCNIC()">START SEARCH</button>
        <button id="copyAllBtn" class="copy-btn" onclick="copyAllMatched()">📋 COPY MATCHED</button>
    </div>
    
    <div id="status" class="status-msg"></div>

    <div class="results-box" id="resultsBox">
        <div id="dynamicContainer"></div>
    </div>
</div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbypmjaOxCghV8sZvlUnOkfF-EsGN4zhuD20nal_PXtjpSLQOHCeYRTiv9U1vGJydU8awQ/exec'; 
    const WHATSAPP_NUM = '447915605790'; 
    let matchedCNICs = []; 

    // LIVE MODE SWITCH (True = Search Chalay gi)
    const IS_LIVE = true; 

    async function searchCNIC() {
        const input = document.getElementById('searchInput').value.trim();
        const status = document.getElementById('status');
        const resBox = document.getElementById('resultsBox');
        const dynamicContainer = document.getElementById('dynamicContainer');
        const copyBtn = document.getElementById('copyAllBtn');
        
        if(!input) { alert("Please enter CNIC numbers!"); return; }
        
        status.innerText = "Connecting to secure database...";
        dynamicContainer.innerHTML = "";
        copyBtn.style.display = "none";
        matchedCNICs = []; 
        
        const queries = input.split('\n').map(q => q.replace(/[^0-9]/g, '').trim()).filter(q => q.length > 0);
        if (queries.length === 0) { alert("No valid CNIC numbers detected!"); return; }

        if (!IS_LIVE) {
            setTimeout(() => {
                status.innerText = "Service Maintenance Mode active.";
                resBox.style.display = 'block';
                const waUrl = `https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent('Salam Rana Vyke Urf Bablo, Main website par aya tha, Kindly mujhe details chahiye.')}`;

                dynamicContainer.innerHTML = `
                    <div class="lock-notice-card">
                        <div class="lock-title">⚠️ SERVICE NOT AVAILABLE</div>
                        <div class="lock-desc">
                            Ye service abi available ni ha inshallah Aj sham 7 bjy ap apni list search kr k apni Finger prints found kr skty hain please 7 bjy tk wait krain.
                        </div>
                        <div class="wa-box" style="max-width: 450px; margin: 15px auto 0 auto;">
                            <a href="${waUrl}" target="_blank" class="wa-link"><i class="fab fa-whatsapp"></i></a>
                            <div class="wa-text" style="font-size:14px; max-width:100%;">
                                <strong>Contact Admin (Rana Vyke Urf Bablo)</strong><br>
                                Click icon to contact via WhatsApp.
                            </div>
                        </div>
                    </div>
                `;
            }, 1000);
            return;
        }

        try {
            const response = await fetch(WEB_APP_URL);
            const data = await response.json();
            
            if(data.error) { status.innerText = "Database Error: " + data.error; return; }

            status.innerText = "Searching records...";
            const cnicSet = new Set(data.cnics);
            
            let tableHTML = `<table><thead><tr><th>TARGET CNIC</th><th>STATUS & ACTION</th></tr></thead><tbody>`;

            queries.forEach(query => {
                if(cnicSet.has(query)) {
                    matchedCNICs.push(query); 
                    const waUrl = `https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(`Salam Rana Vyke Urf Bablo,\nMera yeh CNIC database mein Match ho gaya hai: ${query}\nKindly meri Jazz Android ID Generate kar dein.`)}`;
                    
                    tableHTML += `<tr>
                                    <td>${query}</td>
                                    <td>
                                        <span class="badge found">Matched</span>
                                        <button class="download-btn" onclick="triggerDownloadError('${query}')"><i class="fas fa-file-archive"></i> DOWNLOAD (.RAR)</button>
                                        <div class="wa-box">
                                            <a href="${waUrl}" target="_blank" class="wa-link"><i class="fab fa-whatsapp"></i></a>
                                            <div class="wa-text">Ju Cnic Found ho gaye hain Wo lny k liye Whatsapp pr rabta krian</div>
                                        </div>
                                    </td>
                                  </tr>`;
                } else {
                    tableHTML += `<tr><td>${query}</td><td><span class="badge" style="background:#fff5f5; color:#e53e3e; border:1px solid #fed7d7;">Not Found</span></td></tr>`;
                }
            });
            
            tableHTML += `</tbody></table>`;
            dynamicContainer.innerHTML = tableHTML;
            status.innerText = "Search completed successfully.";
            resBox.style.display = 'block';
            if(matchedCNICs.length > 0) copyBtn.style.display = "inline-block";
            
        } catch (error) {
            status.innerText = "Error: Could not connect to backend.";
            console.error(error);
        }
    }

    function triggerDownloadError(cnic) {
        alert(`🚨 [DOWNLOAD LOCK]\n\nDear User, please recharge your wallet/credit first to download the fingerprint data package for CNIC: ${cnic}.\n\nContact Admin (Rana Vyke Urf Bablo) via WhatsApp to add credit immediately.`);
    }

    function copyAllMatched() {
        if(matchedCNICs.length === 0) return;
        navigator.clipboard.writeText(matchedCNICs.join('\n')).then(() => {
            const btn = document.getElementById('copyAllBtn');
            btn.innerText = "✓ COPIED!";
            setTimeout(() => { btn.innerText = "📋 COPY MATCHED"; }, 2000);
        });
    }
</script>
</body>
</html>
