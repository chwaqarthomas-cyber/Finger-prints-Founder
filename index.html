<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyke Turbo Max Pro Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#0f172a;
    color:white;
    overflow-x:hidden;
}

/* TOPBAR */

.topbar{
    width:100%;
    background:linear-gradient(90deg,#0f172a,#1e293b,#0f172a);
    padding:15px;
    border-bottom:1px solid #334155;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:999;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#38bdf8;
}

.admin-btn{
    background:#25d366;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:12px;
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(37,211,102,0.3);
    transition:.3s;
}

.admin-btn:hover{
    transform:translateY(-2px);
    background:#1ebe5d;
}

.wa-icon{
    width:20px;
    height:20px;
}

/* TICKER */

.ticker{
    width:100%;
    overflow:hidden;
    white-space:nowrap;
    background:#111827;
    padding:12px 0;
    border-bottom:1px solid #334155;
}

.ticker-text{
    display:inline-block;
    animation:move 18s linear infinite;
    color:#38bdf8;
    font-weight:bold;
}

@keyframes move{
    0%{
        transform:translateX(100%);
    }
    100%{
        transform:translateX(-100%);
    }
}

/* CONTAINER */

.container{
    width:95%;
    max-width:1000px;
    margin:30px auto;
    background:#1e293b;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    border:1px solid #334155;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    color:#38bdf8;
    font-size:32px;
}

.title p{
    color:#94a3b8;
    margin-top:8px;
}

/* TEXTAREA */

textarea{
    width:100%;
    height:180px;
    background:#0f172a;
    border:1px solid #334155;
    border-radius:15px;
    padding:15px;
    color:#38bdf8;
    font-size:15px;
    resize:none;
    outline:none;
}

textarea:focus{
    border-color:#38bdf8;
    box-shadow:0 0 10px rgba(56,189,248,0.3);
}

/* BUTTONS */

.btn{
    width:100%;
    margin-top:18px;
    border:none;
    padding:16px;
    border-radius:14px;
    background:linear-gradient(135deg,#0284c7,#0369a1);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.action-bar{
    display:flex;
    gap:15px;
    margin-top:20px;
    flex-wrap:wrap;
}

.small-btn{
    flex:1;
    border:none;
    padding:14px;
    border-radius:12px;
    background:#0f172a;
    color:#38bdf8;
    font-weight:bold;
    cursor:pointer;
    border:1px solid #334155;
    transition:.3s;
}

.small-btn:hover{
    background:#38bdf8;
    color:#0f172a;
}

/* PROGRESS */

.progress-box{
    margin-top:25px;
    background:#0f172a;
    padding:18px;
    border-radius:15px;
    border:1px solid #334155;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
}

.progress-bar{
    width:100%;
    height:12px;
    background:#1e293b;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#38bdf8,#0ea5e9);
    transition:.2s;
}

/* COUNTERS */

.counter-wrap{
    display:flex;
    gap:15px;
    margin-top:15px;
}

.counter{
    flex:1;
    padding:15px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
}

.green{
    background:rgba(34,197,94,0.1);
    border:1px solid #22c55e;
    color:#4ade80;
}

.red{
    background:rgba(239,68,68,0.1);
    border:1px solid #ef4444;
    color:#f87171;
}

/* TABLE */

.results{
    margin-top:25px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
    overflow:hidden;
    border-radius:15px;
}

th{
    background:#0f172a;
    color:#38bdf8;
    padding:14px;
    border:1px solid #334155;
}

td{
    padding:14px;
    border:1px solid #334155;
    text-align:center;
}

tr:nth-child(even){
    background:#0f172a;
}

.badge-found{
    background:#14532d;
    color:#4ade80;
    padding:6px 10px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
}

.badge-not{
    background:#7f1d1d;
    color:#f87171;
    padding:6px 10px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:768px){

    .topbar{
        flex-direction:column;
        gap:12px;
    }

    .counter-wrap{
        flex-direction:column;
    }

    .action-bar{
        flex-direction:column;
    }

}
</style>
</head>

<body>

<div class="topbar">
    <div class="logo">⚡ VYKE TURBO MAX PRO</div>

    <a href="https://wa.me/447915605790" target="_blank" class="admin-btn">
        <svg class="wa-icon" viewBox="0 0 32 32" fill="white">
            <path d="M19.11 17.34c-.29-.14-1.7-.84-1.96-.93-.26-.1-.45-.14-.64.14-.19.29-.74.93-.91 1.12-.17.19-.34.22-.63.07-.29-.14-1.2-.44-2.28-1.39-.84-.75-1.41-1.67-1.57-1.95-.17-.29-.02-.44.13-.58.13-.13.29-.34.43-.5.14-.17.19-.29.29-.48.1-.19.05-.36-.02-.5-.07-.14-.64-1.55-.88-2.12-.23-.56-.47-.48-.64-.49l-.55-.01c-.19 0-.5.07-.76.36-.26.29-1 1-.99 2.45.01 1.44 1.04 2.83 1.18 3.02.14.19 2.04 3.11 4.95 4.36.69.3 1.23.48 1.65.61.69.22 1.32.19 1.81.12.55-.08 1.7-.69 1.94-1.36.24-.67.24-1.24.17-1.36-.07-.12-.26-.19-.55-.33z"/>
        </svg>
        Contact Admin
    </a>
</div>

<div class="ticker">
    <div class="ticker-text">
        ⚡ FEMALE PRICE: 1500 PKR ⚡ MALE PRICE: 1200 PKR ⚡ SECURE CLOUD ONLINE ⚡ VYKE CORE ENGINE V2 ACTIVE ⚡
    </div>
</div>

<div class="container">

    <div class="title">
        <h1>CNIC Fingerprint Founder System</h1>
        <p>System Owner: Rana Vyke Urf Bablo</p>
    </div>

    <textarea id="cnicInput" placeholder="5440178619178&#10;5530232277050"></textarea>

    <button class="btn" onclick="startSearch()">
        START SECURE BULK SEARCH
    </button>

    <div class="action-bar">
        <button class="small-btn" onclick="copyAllCNICs()">
            📋 Copy All CNICs
        </button>

        <button class="small-btn" onclick="downloadFingerprint()">
            📥 Download Fingerprint
        </button>
    </div>

    <div class="progress-box">
        <div class="progress-top">
            <span id="progressText">Initializing...</span>
            <span id="progressPercent">0%</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="counter-wrap">
            <div class="counter green">
                ✅ Found: <span id="foundCount">0</span>
            </div>

            <div class="counter red">
                ❌ Not Found: <span id="notFoundCount">0</span>
            </div>
        </div>
    </div>

    <div class="results">

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>CNIC</th>
                    <th>Status</th>
                    <th>Database</th>
                </tr>
            </thead>

            <tbody id="tableBody"></tbody>

        </table>

    </div>

</div>

<script>

function startSearch(){

    let input=document.getElementById('cnicInput').value.trim();

    let cnics=input.split('\n');

    let table=document.getElementById('tableBody');

    table.innerHTML='';

    let found=0;
    let notFound=0;

    for(let i=0;i<cnics.length;i++){

        let percent=Math.round(((i+1)/cnics.length)*100);

        document.getElementById('progressFill').style.width=percent+'%';

        document.getElementById('progressPercent').innerText=percent+'%';

        document.getElementById('progressText').innerText='Scanning Secure Database...';

        let random=Math.random();

        let status=random>0.4?'FOUND':'NOT FOUND';

        let tr=document.createElement('tr');

        if(status==='FOUND'){

            found++;

            document.getElementById('foundCount').innerText=found;

            tr.innerHTML=`
            <td>${i+1}</td>
            <td>${cnics[i]}</td>
            <td><span class="badge-found">FOUND</span></td>
            <td>Punjab NADRA</td>
            `;

        }else{

            notFound++;

            document.getElementById('notFoundCount').innerText=notFound;

            tr.innerHTML=`
            <td>${i+1}</td>
            <td>${cnics[i]}</td>
            <td><span class="badge-not">NOT FOUND</span></td>
            <td>-</td>
            `;
        }

        table.appendChild(tr);

    }

}

function copyAllCNICs(){

    let rows=document.querySelectorAll('#tableBody tr');

    let data=[];

    rows.forEach(row=>{
        data.push(row.children[1].innerText);
    });

    navigator.clipboard.writeText(data.join('\n'));

    alert('✅ All CNICs Copied');

}

function downloadFingerprint(){

    let rows=document.querySelectorAll('#tableBody tr');

    let data=[];

    rows.forEach(row=>{
        data.push(row.children[1].innerText);
    });

    let blob=new Blob([data.join('\n')],{type:'text/plain'});

    let a=document.createElement('a');

    a.href=URL.createObjectURL(blob);

    a.download='fingerprint.txt';

    a.click();

}

</script>

</body>
</html>
