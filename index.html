<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNIC Fingerprint Founder System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 500px; background: white; margin: 40px auto; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a365d; margin-bottom: 5px; }
        .system-owner { font-size: 14px; color: #718096; margin-bottom: 20px; }
        .warning-box { background-color: #fffaf0; border: 1px solid #feebc8; color: #c05621; padding: 15px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 16px; text-align: center; }
        button { width: 100%; background-color: #319795; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #2c7a7b; }
        .result { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; font-weight: bold; }
        .found { background-color: #c6f6d5; color: #22543d; border: 1px solid #9ae6b4; }
        .not-found { background-color: #fed7d7; color: #742a2a; border: 1px solid #feb2b2; }
        .loading { color: #4a5568; font-style: italic; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>CNIC FINGERPRINT FOUNDER SYSTEM</h2>
    <div class="system-owner">SYSTEM OWNER: Rana Vyke Urf Bablo</div>
    
    <div class="warning-box">
        ⚠️ SYSTEM FEES WARNING<br>
        Ek CNIC Fingerprint Found Hony Par 1200 Rs Cut Hoga! Balance Lazmi Check Kar Lain.
    </div>

    <input type="text" id="cnicInput" placeholder="Enter CNIC (e.g., 3520212345677)" maxlength="15">
    <button onclick="searchCNIC()">START SEARCH</button>
    
    <div id="loadingBox" class="loading">Searching secure database...</div>
    <div id="resultBox" class="result"></div>
</div>

<script>
async function searchCNIC() {
    let cnic = document.getElementById('cnicInput').value.replace(/[- ]/g, '').trim();
    let resultBox = document.getElementById('resultBox');
    let loadingBox = document.getElementById('loadingBox');
    
    if(cnic.length < 5) {
        alert('Baraye meharbani mukammal aur darust CNIC darj karein.');
        return;
    }
    
    // UI Reset
    resultBox.style.display = 'none';
    loadingBox.style.display = 'block';
    
    // ⚠️ APNA APPS SCRIPT URL YAHAN PASTE KAREIN
    const scriptUrl = "YOUR_GOOGLE_SCRIPT_WEB_APP_URL"; 
    
    try {
        // Google Script ko secure request bhejna
        let response = await fetch(`${scriptUrl}?cnic=${cnic}`);
        let data = await response.json();
        
        loadingBox.style.display = 'none';
        
        if(data.status === "found") {
            resultBox.className = "result found";
            resultBox.innerHTML = `✅ FINGERPRINT FOUND!<br>Database Location: ${data.owner}`;
            resultBox.style.display = 'block';
        } else {
            resultBox.className = "result not-found";
            resultBox.innerHTML = "❌ Record Not Found in our system.";
            resultBox.style.display = 'block';
        }
    } catch (error) {
        loadingBox.style.display = 'none';
        resultBox.className = "result not-found";
        resultBox.innerHTML = "⚠️ System error or connection timeout.";
        resultBox.style.display = 'block';
        console.error(error);
    }
}
</script>
</body>
</html>
